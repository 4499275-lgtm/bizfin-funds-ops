<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>业财一体资金运营平台 · 控制台</title>
<style>
:root{--navy:#102540;--blue:#1769e0;--green:#138a5b;--amber:#ad6b00;--red:#c53d4a;--ink:#1b2a40;--muted:#6f7d91;--line:#dfe6ef;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(180deg,var(--navy),#0a1c31);color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0}header .sub{color:#9db4d0;font-size:12px;margin-top:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,button{font:inherit}
select,input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.small{padding:5px 8px;font-size:12px}
main{padding:20px 26px 60px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px;border:1px solid #e5ebf3;border-radius:13px;background:#fff}.kpi label{color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:22px;margin-top:6px}
.panel{background:#fff;border:1px solid #e5ebf3;border-radius:14px;overflow:hidden;margin-bottom:16px}
.panel-h{padding:13px 16px;border-bottom:1px solid #edf1f6;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:15px;margin:0}.panel-h .hint{color:var(--muted);font-size:12px}
.panel-b{padding:14px 16px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{padding:9px 8px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px;vertical-align:top}
th{color:#65758a;background:#f9fbfd;font-weight:650;position:sticky;top:0}
.money{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tag{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:11px;white-space:nowrap}
.tag.green{color:var(--green);background:#e8f7f0}.tag.red{color:var(--red);background:#fff0f1}.tag.amber{color:var(--amber);background:#fff5da}.tag.blue{color:var(--blue);background:#eaf2ff}.tag.gray{color:#647185;background:#eef1f5}
.bar{padding:10px 14px;border-radius:10px;background:#f5f8fc;font-size:12px;line-height:1.7;margin-bottom:12px}
dialog{border:1px solid var(--line);border-radius:14px;max-width:860px;width:94%}
dialog::backdrop{background:rgba(10,24,43,.5)}
.form{display:grid;gap:10px;padding:6px 2px}
.form label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{position:fixed;right:20px;bottom:20px;background:#10243e;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
.msg.show{opacity:1}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div><h1>业财一体资金运营平台 · 控制台</h1><div class="sub">单账户 · 单日收入勾兑 ｜ 四层引擎 ｜ API 优先，控制台为辅助操作面</div></div>
  <div class="toolbar">
    <select id="accountSel" title="银行账户"></select>
    <input id="reconDate" type="date" value="2026-08-03" title="勾兑日"/>
    <button class="primary" onclick="runEval()">运行四层评估</button>
    <button onclick="loadScene('flower')">演示·鲜花</button>
    <button onclick="loadScene('property')">演示·物业</button>
  </div>
</header>
<main>
  <div class="kpis" id="kpis"></div>

  <div class="panel">
    <div class="panel-h"><h2>银行流水导入</h2><div class="hint">CSV / XLSX · 自动识别通用模板与招行 CBS 对账单 · 支出行仅留存原始行</div></div>
    <div class="panel-b">
      <div class="toolbar">
        <input type="file" id="bankFile" accept=".csv,.xlsx"/>
        <button onclick="importBank(false)">校验并导入</button>
        <button onclick="importBank(true)">仅预览校验</button>
        <span class="group-sep"></span>
        <a href="/api/v1/templates/bank.csv"><button class="small">银行模板 CSV</button></a>
        <a href="/api/v1/templates/orders.csv"><button class="small">订单模板 CSV</button></a>
      </div>
      <div id="importResult" class="bar" style="display:none"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><h2>银行流水与四层结果</h2>
      <div class="toolbar">
        <select id="exportFormat"><option value="csv">导出 CSV</option><option value="xlsx">导出 XLSX</option></select>
        <button class="small" onclick="exportDaily()">勾兑日报表</button>
        <button class="small" onclick="exportTrusted()">可信状态 JSON</button>
        <button class="small" onclick="exportExceptions()">异常清单</button>
        <button class="small" onclick="exportGroups()">认领组明细</button>
      </div>
    </div>
    <div class="panel-b"><table><thead><tr>
      <th>流水</th><th>付款方 / 摘要</th><th>金额</th><th>① 身份</th><th>② 认领</th><th>③ 异常</th><th>④ 可信状态</th><th>操作</th>
    </tr></thead><tbody id="stmtRows"></tbody></table></div>
  </div>

  <div class="panel">
    <div class="panel-h"><h2>异常中心</h2><div class="hint">受理 = 开始跟踪 ｜ 关闭必须填写依据 ｜ 认领动作回到第二层</div></div>
    <div class="panel-b"><table><thead><tr>
      <th>事件</th><th>类型 / 规则</th><th>流水</th><th>定位 / 责任</th><th>状态</th><th>处理路径</th><th>操作</th>
    </tr></thead><tbody id="excRows"></tbody></table></div>
  </div>

  <div class="panel">
    <div class="panel-h"><h2>审计记录</h2><button class="small" onclick="exportAudit()">导出审计 CSV</button></div>
    <div class="panel-b"><table><thead><tr><th>时间</th><th>类型</th><th>对象</th><th>说明</th></tr></thead><tbody id="auditRows"></tbody></table></div>
  </div>
</main>

<dialog id="allocDlg">
  <form class="form" method="dialog" onsubmit="return false">
    <h3 id="allocTitle" style="margin:4px 0">第二层资金归属</h3>
    <div id="allocInfo" class="bar"></div>
    <div class="row">
      <div><label>路径A：业务订单 ID</label><input id="allocOrder" placeholder="订单快照 ID（可留空）"/></div>
      <div><label>认领金额（元）</label><input id="allocAmount" type="number" step="0.01" min="0"/></div>
    </div>
    <div class="row">
      <div><label>路径B：无应收资金类型（与路径A二选一）</label><select id="allocNRT"></select></div>
      <div><label>凭据 / 外部确认依据</label><input id="allocEvidence" placeholder="财务审批单、银行结息单等"/></div>
    </div>
    <div><label>确认说明</label><input id="allocNote" value="客户财务基于银行事实与业务资料确认本次资金归属。"/></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="allocDlg.close()">取消</button>
      <button class="primary" onclick="submitAlloc()">确认第二层决策</button>
    </div>
  </form>
</dialog>

<div class="msg" id="msg"></div>
<script src="/app.js"></script>
</body>
</html>
